name: Fix backend URL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace backend URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='https://gamepaycafe.onrender.com'
          new='https://whatsapp-ai-79tq.onrender.com'
          if old not in s:
              print('Old URL not found; checking whether new URL is already present')
              if new in s:
                  print('Already fixed')
              else:
                  raise SystemExit('Backend URL not found')
          else:
              p.write_text(s.replace(old,new))
              print('Backend URL replaced')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix production booking backend URL'
            git push
          fi
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-backend-url.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove temporary URL fix workflow'
          git push
